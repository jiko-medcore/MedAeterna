name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verification:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      EMAIL_FROM: ci@example.test
      EMAIL_REPLY_TO: ci@example.test
      APP_NAME: MedAeterna CI
      FRONTEND_URL: http://localhost:3000
      SUPPORT_EMAIL: support@example.test
      JWT_AUDIENCE: authenticated
      FHIR_VERSION: R4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary==2.9.11

      - name: Compile backend and tests
        run: python -m compileall -q app tests

      - name: Run backend test suite
        run: python -m pytest -q
